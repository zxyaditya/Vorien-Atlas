name: Atlas CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        # Pre-install CPU-only PyTorch to prevent downloading ~5GB CUDA/GPU wheels on CI
        pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
        pip install --no-cache-dir -r requirements.txt
        pip install --no-cache-dir pytest pytest-cov pytest-xdist
        
    - name: Run Pytest with Code Coverage
      env:
        PYTHONPATH: atlasnew/libs/python:atlasnew
      run: |
        pytest tests/ -v --cov=atlasnew/libs/python/atlas_core/registry --cov=atlasnew/libs/python/learning_system --cov=atlasnew/libs/python/decision_engine --cov=atlasnew/libs/python/paper_trading --cov-report=term-missing

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: atlasnew/apps/web/package-lock.json
        
    - name: Install Web Dependencies
      run: |
        cd atlasnew/apps/web
        npm ci
        
    - name: Build Web Application
      run: |
        cd atlasnew/apps/web
        npm run build
